    <!-- include vertex shaders -->

    <script id="wireframe-V" type="x-shader/x-vertex">
        #version 300 es
        precision highp float;
        
        // --- Attributes ---
        in vec4 aVertexPosition; // Vertex position in model space (x,y,z,w)
        in vec3 aNormal;         // Vertex normal in model space
        in vec2 aUV;             // Vertex texture coordinate
        
        // --- Uniforms ---
        uniform mat4 uModelT;        // Model matrix
        uniform mat4 uViewT;         // View matrix
        uniform mat4 uProjT;        // Projection matrix
        uniform mat3 uNormalMatrix;  // Transpose(Inverse(mat3(ModelView))) matrix
        
        // --- Outputs to Fragment Shader ---
        out vec3 vNormal;       // Normal in View Space
        out vec3 vFragPos;      // Fragment position in View Space
        out vec2 vUV;           // Texture coordinate
        
        void main() {
            // Calculate position in View Space
            vec4 viewPos = uViewT * uModelT * aVertexPosition;
            vFragPos = viewPos.xyz; // Pass position (before projection)
        
            // Transform Normal to View Space using Normal Matrix
            vNormal = normalize(uNormalMatrix * aNormal);
        
            // Pass UV coordinate through
            vUV = aUV;
        
            // Calculate final clip space position
            gl_Position = uProjT * viewPos;
        }
        </script>

     <!-- wireframe fragment Shaders -->
     <script id="wireframe-F" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;
        
        // --- Inputs from Vertex Shader ---
        in vec3 vNormal;       // Interpolated Normal in View Space
        in vec3 vFragPos;      // Interpolated Fragment position in View Space
        in vec2 vUV;           // Interpolated Texture coordinate
        
        // --- Uniforms ---
        // Texture
        uniform sampler2D uSampler;
        
        // Light Properties (View Space light position set from JS)
        uniform vec3 uLightPos;       // Light position in View Space
        uniform vec3 uLightColor;
        uniform vec3 uAmbientColor;
        
        // Material Properties
        uniform vec3 uMaterialSpecularColor;
        uniform float uShininess;
        // We'll use the texture for diffuse color
        
        // Camera Position (World Space - needed to calc View Vector)
        // uniform vec3 uViewPos; // If calculating View vector in World space
        // OR calculate View vector directly in View space (simpler)
        
        // --- Output ---
        out vec4 fragColor;
        
        void main() {
            // Get base color from the texture
            vec4 textureColor = texture(uSampler, vUV);
        
            // Normalize the incoming normal vector (interpolation can change length)
            vec3 normal = normalize(vNormal);
        
            // --- Ambient Component ---
            // Use ambient light color directly, multiplied by texture color
            vec3 ambient = uAmbientColor * textureColor.rgb;
        
            // --- Diffuse Component ---
            // Calculate direction from fragment to light source (in View Space)
            vec3 lightDir = normalize(uLightPos - vFragPos);
            // Calculate diffuse intensity (clamped at 0)
            float diffIntensity = max(dot(normal, lightDir), 0.0);
            // Calculate diffuse color
            vec3 diffuse = diffIntensity * uLightColor * textureColor.rgb;
        
            // --- Specular Component ---
            // Calculate view direction (from fragment to camera, in View Space)
            // In view space, the camera is at the origin (0,0,0)
            vec3 viewDir = normalize(-vFragPos); // Vector from frag pos to origin
            // Calculate reflection vector
            vec3 reflectDir = reflect(-lightDir, normal);
            // Calculate specular intensity
            float specIntensity = pow(max(dot(viewDir, reflectDir), 0.0), uShininess);
            // Calculate specular color
            vec3 specular = specIntensity * uLightColor * uMaterialSpecularColor;
        
            // --- Final Color ---
            // Combine ambient, diffuse, specular components
            vec3 finalColor = ambient + diffuse + specular;
        
            // Output final color (use texture's alpha if needed, otherwise 1.0)
            fragColor = vec4(finalColor, textureColor.a);
            // fragColor = vec4(finalColor, 1.0); // Or force opaque
        }
        </script>
